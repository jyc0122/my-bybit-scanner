name: OKX hourly full scan and weakening alert

on:
  schedule:
    # Run near the end of each hour while avoiding GitHub Actions' top-of-hour congestion.
    - cron: "59 * * * *"
    # Fallback wake-up: it exits without scanning when a recent run already succeeded.
    - cron: "14 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: okx-hourly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare state branch
        shell: bash
        run: |
          if git fetch origin automation-state:refs/remotes/origin/automation-state; then
            git worktree add state refs/remotes/origin/automation-state
          else
            git worktree add --detach state
            cd state
            git checkout --orphan automation-state
            git rm -rf .
          fi

      - name: Decide whether a scan is due
        id: due
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested"
            exit 0
          fi
          LAST_GENERATED_MS=$(node -e "try { const x=require('./state/latest.json'); console.log(Date.parse(x.generatedAt) || 0) } catch { console.log(0) }")
          NOW_MS=$(node -e "console.log(Date.now())")
          AGE_MS=$((NOW_MS - LAST_GENERATED_MS))
          if [ "$LAST_GENERATED_MS" -eq 0 ] || [ "$AGE_MS" -ge 2700000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scan is due; previous successful state is ${AGE_MS} ms old"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Recent scan found; fallback exits without scanning"
          fi

      - name: Run full OKX scan
        if: steps.due.outputs.run == 'true'
        env:
          BYBIT_SCAN_CONCURRENCY: 4
          BYBIT_REQUEST_GAP_MS: 125
        run: >-
          node scripts/cloud-hourly.mjs
          --mode=full
          --baseline=state/baseline.json
          --output=state/latest.json
          --notification=state/notification.md

      - name: Publish monitor state
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.json latest.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "update OKX monitor state"
            git push origin HEAD:automation-state
          fi

      - name: Notify through GitHub issue
        if: steps.due.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOULD_NOTIFY=$(node -e "const x=require('./state/latest.json'); console.log(x.notify ? 'true' : 'false')")
          if [ "$SHOULD_NOTIFY" != "true" ]; then
            echo "No weakening alert to publish"
            exit 0
          fi
          TITLE="OKX LRC6 减弱提醒"
          ISSUE_NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL=$(gh issue create --title "$TITLE" --assignee jyc0122 --body "由 OKX hourly full scan monitor 自动维护。每小时执行一次 OKX 全量扫描，只在发现 LRC6 数值减弱时追加提醒。")
            ISSUE_NUMBER=${ISSUE_URL##*/}
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file state/notification.md

      - name: Notify Telegram when LRC6 weakens
        if: steps.due.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-notify.mjs state/latest.json

      - name: Add run summary
        if: steps.due.outputs.run == 'true'
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat state/latest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
